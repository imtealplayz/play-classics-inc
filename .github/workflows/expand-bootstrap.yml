name: Expand Play Classics bootstrap
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Expand application source
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/parts/part-00.txt
          mkdir -p /tmp/play-classics-source
          cat bootstrap/parts/part-*.txt | tr -d '\n' | base64 --decode | tar -xJ -C /tmp/play-classics-source
          test -f /tmp/play-classics-source/play-classics-inc/package.json
          cp -a /tmp/play-classics-source/play-classics-inc/. .
          rm -rf bootstrap
          rm -f .github/workflows/expand-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Play Classics application source"
          git push
